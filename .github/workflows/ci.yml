# Mirror of the GitLab pipeline.
#
# GitLab runs the primary CI, but the GitHub mirror is the link that goes on a
# resume, and a repo with a green check next to the latest commit reads very
# differently from one without.

name: lint and simulate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq verilator make g++
          pip install -q 'cocotb>=1.9,<2.0'
          verilator --version

      - name: Lint
        run: |
          verilator --lint-only -Wall --timing \
            rtl/pkt_pkg.sv rtl/frame_parse.sv rtl/resp_gen.sv rtl/parser_top.sv \
            --top-module parser_top

      - name: Simulate
        run: bash scripts/run_tests.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: tb/results.xml
