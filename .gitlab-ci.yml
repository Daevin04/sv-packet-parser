# Lint and simulate every example configuration on every push.
#
# The point of running this in CI rather than only locally is that the repo's
# front page then carries a pipeline badge - evidence a reader gets without
# cloning anything or taking your word for it.

image: python:3.12-slim

verify:
  before_script:
    # Verilator from Debian is a few versions behind upstream but stable, and
    # avoids a 10-minute source build on every pipeline.
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq verilator make g++
    - pip install -q --disable-pip-version-check 'cocotb>=1.9,<2.0'
  script:
    # Lints both configurations with -Wall as errors, then simulates both.
    - bash scripts/run_tests.sh
  artifacts:
    when: always
    paths:
      - tb/results_*.xml
    reports:
      junit: tb/results_*.xml
    expire_in: 30 days
